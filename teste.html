<style>
/* Paleta oficial da Solutio (PALETA-CORES.pdf): vinho 823A35, grafite 2B2826, areia E3DDD8 */
:root{--vinho:#823A35;--vinho-esc:#6A2E2A;--vinho-cl:#F4E9E7;--grafite:#2B2826;--areia:#E3DDD8;--areia-cl:#F5F2EF;
--branco:#fff;--cinza:#8A837E;--linha:#D9D2CC;--verde:#2F7A4B;--verde-cl:#EAF5EE;--vermelho:#B03A2E;--vermelho-cl:#FBECEA;--ambar:#A86A12;--ambar-cl:#FCF3E2;
--raio:8px;--sombra:0 1px 4px rgba(43,40,38,.08)}
/* Fonte da marca: ID Grotesk (pasta fontes/). Se a pasta nao estiver
   publicada, cai na letra padrao do computador e tudo funciona igual. */
@font-face{font-family:'ID Grotesk';src:url(fontes/IDGrotesk-Light.ttf) format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'ID Grotesk';src:url(fontes/IDGrotesk-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'ID Grotesk';src:url(fontes/IDGrotesk-Medium.ttf) format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'ID Grotesk';src:url(fontes/IDGrotesk-Semibold.ttf) format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'ID Grotesk';src:url(fontes/IDGrotesk-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'ID Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--areia-cl);color:var(--grafite);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.marca-logo{font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.marca-logo small{display:block;font-weight:400;letter-spacing:.3em;font-size:10px;opacity:.8}
.topo{background:var(--grafite);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;height:56px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--vinho)}
.abas{position:relative}
.topo .quem{font-size:13px;opacity:.85;display:flex;align-items:center;gap:10px}
.faixa-teste{background:#E07A1F;color:#fff;text-align:center;font-size:12px;font-weight:600;padding:4px;letter-spacing:.05em}
.abas{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;border-bottom:1px solid var(--linha);background:var(--branco)}
.aba{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--cinza);font-weight:500}
.aba.on{color:var(--vinho);border-bottom-color:var(--vinho)}
.conteudo{padding:16px;max-width:1400px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--raio);border:1px solid var(--linha);background:var(--branco);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--areia-cl)}
.btn-p{background:var(--vinho);border-color:var(--vinho-esc);color:#fff}.btn-p:hover{background:var(--vinho-esc)}
.btn-claro{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}.btn-claro:hover{background:rgba(255,255,255,.22)}
.btn:disabled{opacity:.5;cursor:default}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.barra input,.barra select{padding:7px 10px;border:1px solid var(--linha);border-radius:var(--raio);background:#fff}
.barra .esp{flex:1}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.cartao{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:12px 14px;border-left:4px solid var(--vinho)}
.cartao .n{font-size:20px;font-weight:700}.cartao .t{font-size:12px;color:var(--cinza)}
.funil{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.coluna{background:var(--areia);border-radius:var(--raio);padding:10px;min-height:200px}
.coluna h3{font-size:13px;display:flex;justify-content:space-between;margin-bottom:8px}
.coluna h3 span{color:var(--cinza);font-weight:400}
.neg{background:#fff;border-radius:6px;padding:10px;margin-bottom:8px;box-shadow:var(--sombra);cursor:pointer;border-left:3px solid var(--vinho)}
.neg:hover{outline:1px solid var(--vinho)}
.neg .c{font-weight:600}.neg .p{font-size:12px;color:var(--cinza)}.neg .v{font-weight:600;color:var(--vinho);margin-top:4px}
.etq{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-top:4px;margin-right:4px}
.etq-semdata{background:var(--ambar-cl);color:var(--ambar)}
.etq-ganho{background:var(--verde-cl);color:var(--verde)}
.etq-perdido{background:var(--vermelho-cl);color:var(--vermelho)}
.etq-aberto{background:var(--areia);color:var(--grafite)}
.etq-dal{background:var(--vinho-cl);color:var(--vinho)}
.tabela-caixa{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--areia);white-space:nowrap}
th{font-size:12px;color:var(--cinza);font-weight:600;background:var(--areia-cl);position:sticky;top:0}
td.num,th.num{text-align:right}
tbody tr.clic{cursor:pointer}tbody tr.clic:hover{background:var(--vinho-cl)}
tfoot td{font-weight:700;background:var(--areia-cl)}
h2{font-size:16px;margin:18px 0 10px}
.aviso{background:var(--ambar-cl);color:var(--ambar);border-radius:var(--raio);padding:10px 14px;margin-bottom:12px}
.aviso.erro{background:var(--vermelho-cl);color:var(--vermelho)}
.vazio{padding:30px;text-align:center;color:var(--cinza)}
/* modal */
.fundo{position:fixed;inset:0;background:rgba(43,40,38,.5);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow:auto;padding:24px 12px}
.fundo.on{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-topo{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--areia)}
.modal-topo h3{font-size:16px}
.modal-corpo{padding:16px 18px}
.modal-pe{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--areia);flex-wrap:wrap}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}.fg.l2{grid-column:span 2}
.fg label{font-size:12px;color:var(--cinza);font-weight:500}
.fg input,.fg select,.fg textarea{padding:8px 10px;border:1px solid var(--linha);border-radius:6px;background:#fff;width:100%}
.fg textarea{min-height:70px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--vinho);border-color:var(--vinho)}
.dica{font-size:11.5px;color:var(--cinza)}
.notas{margin-top:12px;max-height:200px;overflow:auto;border-top:1px solid var(--areia);padding-top:8px}
.nota{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--areia)}.nota b{font-size:11.5px;color:var(--cinza);font-weight:500;display:block}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:32px;background:var(--vinho);padding:32px 6vw;position:relative;overflow:hidden}
.login-marca-dagua{position:absolute;left:18%;top:50%;width:min(62vh,560px);transform:translateY(-50%);opacity:.95;pointer-events:none}
.login-frase{position:relative;color:var(--areia);max-width:520px}
.login-frase h1{font-size:clamp(32px,4.4vw,56px);line-height:1.08;font-weight:300;letter-spacing:-.01em}
.login-frase h1 b{font-weight:700;display:block}
.login-tag{display:flex;align-items:center;gap:12px;margin-top:40px;font-size:15px;line-height:1.2}
.login-tag img{width:34px;height:34px}
.login-caixa{position:relative;background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;justify-self:end;box-shadow:0 20px 50px rgba(43,40,38,.35)}
@media (max-width:800px){.login{grid-template-columns:1fr;padding:24px 16px}.login-frase{display:none}.login-caixa{justify-self:center}.login-marca-dagua{left:50%;transform:translate(-50%,-50%);opacity:.6}}
.logo-login{display:block;width:100%;max-width:280px;height:auto;margin:0 auto 22px}
.logo-topo{display:flex;align-items:center;gap:10px}.logo-topo img{height:40px;width:auto;display:block}.logo-topo span{font-size:11px;letter-spacing:.3em;opacity:.7;border-left:1px solid rgba(255,255,255,.3);padding-left:10px}
.login-caixa .fg{margin-bottom:12px}
.login-caixa .btn{width:100%;justify-content:center;padding:10px}
.msg{min-height:18px;font-size:13px;color:var(--vermelho);margin-top:8px;text-align:center}
.senha-caixa{position:relative;display:block}.senha-caixa input{padding-right:42px!important;width:100%}
.olhinho{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:6px;color:var(--cinza);display:flex;border-radius:6px}
.olhinho:hover{color:var(--vinho);background:var(--areia-cl)}.olhinho svg{width:20px;height:20px}
.oculto{display:none!important}
@media (max-width:640px){.grade{grid-template-columns:1fr}.fg.l2{grid-column:span 1}.topo .quem span{display:none}}
.timbre{display:none}
@media print{.topo,.abas,.barra,.faixa-teste,.aviso{display:none!important}body{background:#fff;font-size:12px}.cartao,.tabela-caixa{box-shadow:none}
.conteudo{padding:0 0 0 22px;border-left:1.5px solid var(--vinho);max-width:none}
.timbre{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 18px -22px;padding:0 0 12px 22px;border-bottom:1px solid var(--areia)}
.timbre img{height:34px}.timbre div{text-align:right;font-size:11px;color:var(--cinza)}.timbre b{display:block;font-size:15px;color:var(--grafite);font-weight:600}
th{position:static}h2{break-after:avoid}tr{break-inside:avoid}
@page{margin:16mm 14mm}}
</style>
</head>

<script>
// ============================================================================
//  CRM DA SOLUTIO — tela. Os dados ficam no banco da Solutio, atrás do
//  porteiro (Worker) dela. Nada de senha ou chave neste arquivo: ele é público.
//  Teste x produção: a ÚNICA diferença entre teste.html e index.html é a
//  linha SISTEMA abaixo.
// ============================================================================
const SISTEMA='crm_solutio_teste';
const WORKER='https://solutio-api.solution-solucoes-esquadrias.workers.dev';
const NO_TESTE=/_teste$/.test(SISTEMA);
const ETAPAS=[
  {id:'proposta',nome:'Proposta',tipo:'aberto'},
  {id:'negociacao',nome:'Negociação',tipo:'aberto'},
  {id:'ganho',nome:'Fechado',tipo:'ganho'},
  {id:'perdido',nome:'Perdido',tipo:'perdido'}
];
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

let cracha='', eu=null, dados={orcamentos:[]}, versao=0, dal=null, vista='funil', fichaId=null;
const filtro={busca:'',ano:'',marca:'',vendedor:'',situacao:'',semData:false};

// ---------- utilidades ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }
function moeda(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function lerValor(t){ t=String(t||'').replace(/[^\d,.-]/g,''); if(t.indexOf(',')>=0) t=t.replace(/\./g,'').replace(',','.'); const n=parseFloat(t); return isFinite(n)?Math.round(n*100)/100:0; }
function valorCampo(v){ return v?Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''; }
function dataBR(iso){ if(!iso) return ''; const d=String(iso).slice(0,10).split('-'); return d.length===3?d[2]+'/'+d[1]+'/'+d[0]:''; }
function agora(){ return new Date().toISOString(); }
function novoId(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function etapa(id){ return ETAPAS.find(function(e){return e.id===id;})||ETAPAS[0]; }
function ativos(){ return (dados.orcamentos||[]).filter(function(o){return !o.excluido;}); }
function podeAlterar(){ return eu && eu.r!=='consulta'; }
// Funções iguais às da Daluminium. Quem decide de verdade é o porteiro; a tela só esconde o botão.
const NIVEL={consulta:1,funcionario:2,gerente:3,admin:4};
function nivel(){ return (eu&&NIVEL[eu.r])||0; }
const ROTULO={admin:'Administrador',gerente:'Gerente',funcionario:'Funcionário',consulta:'Só consulta'};

async function api(acao,metodo,corpo){
  const h={'Content-Type':'application/json','X-Action':acao||''};
  h['X-Sistema']=SISTEMA;   // o porteiro usa para saber o ambiente (logins separados)
  if(cracha) h['Authorization']='Bearer '+cracha;
  let r;
  try{ r=await fetch(WORKER,{method:metodo||'GET',headers:h,body:corpo?JSON.stringify(corpo):undefined}); }
  catch(e){ return {status:0,j:{erro:'Sem conexão com o servidor. Confira a internet.'}}; }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401 && acao!=='login'){ sair(true); }
  return {status:r.status,j:j};
}

// ---------- entrar / sair ----------
async function entrar(){
  const u=$('l-u').value.trim(), s=$('l-s').value;
  if(!u||!s){ $('l-msg').textContent='Preencha usuário e senha.'; return; }
  $('l-btn').disabled=true; $('l-msg').textContent='';
  const r=await api('login','POST',{u:u,senha:s});
  $('l-btn').disabled=false;
  if(r.status!==200){ $('l-msg').textContent=r.j.erro||'Não consegui entrar.'; return; }
  cracha=r.j.cracha; eu=r.j.usuario;
  try{ sessionStorage.setItem('solutio-cracha-'+SISTEMA,cracha); sessionStorage.setItem('solutio-eu-'+SISTEMA,JSON.stringify(eu)); }catch(e){}
  $('l-s').value=''; esconderSenhas();
  await abrirSistema();
  if(eu.trocar) abrirSenha(true);
}
function sair(venceu){
  cracha=''; eu=null;
  try{ sessionStorage.removeItem('solutio-cracha-'+SISTEMA); sessionStorage.removeItem('solutio-eu-'+SISTEMA); }catch(e){}
  $('tela-app').classList.add('oculto'); $('tela-login').classList.remove('oculto');
  if(venceu===true) $('l-msg').textContent='Sua sessão venceu. Entre de novo.';
}
async function abrirSistema(){
  $('tela-login').classList.add('oculto'); $('tela-app').classList.remove('oculto');
  $('faixa-teste').classList.toggle('oculto',!NO_TESTE);
  $('quem-nome').textContent=eu.n+(eu.r==='consulta'?' (só consulta)':'');
  $('aba-usuarios').classList.toggle('oculto',nivel()<NIVEL.gerente);
  $('aba-acessos').classList.toggle('oculto',eu.r!=='admin');
  $('conteudo').innerHTML='<div class="vazio">Carregando…</div>';
  await carregar();
  render();
  carregarDal();
}
async function carregar(){
  const r=await api('','GET');
  if(r.status!==200){ $('conteudo').innerHTML='<div class="aviso erro">'+esc(r.j.erro||r.j.mensagem||'Não consegui carregar.')+'</div>'; return false; }
  dados=r.j.data||{}; if(!Array.isArray(dados.orcamentos)) dados.orcamentos=[];
  versao=r.j.versao||0;
  return true;
}
async function carregarDal(){
  const r=await api('daluminium','GET');
  dal=r.j||{orcamentos:[]};
  if(vista==='dal'||vista==='relatorio') render();
}

// Grava com segurança: lê o que está no banco, aplica a mudança e grava. Se
// alguém salvou no meio, lê de novo e reaplica (até 3 vezes).
async function alterar(mudanca){
  for(let t=0;t<3;t++){
    if(t>0 && !(await carregar())) return false;
    const copia=JSON.parse(JSON.stringify(dados));
    if(mudanca(copia)===false) return false;
    const r=await api('','PUT',{data:copia,versao:versao});
    if(r.status===200){ dados=copia; versao=r.j.versao; return true; }
    if(r.status!==409){ alert(r.j.erro||'Não consegui salvar. Tente de novo.'); return false; }
  }
  alert('Muita gente salvando ao mesmo tempo. Tente de novo em instantes.');
  return false;
}

// ---------- navegação ----------
function irPara(v){
  vista=v;
  document.querySelectorAll('.aba').forEach(function(a){ a.classList.toggle('on',a.dataset.v===v); });
  render();
}
function render(){
  preencherSugestoes();
  const c=$('conteudo');
  if(vista==='funil') c.innerHTML=htmlFunil();
  else if(vista==='lista') c.innerHTML=htmlLista();
  else if(vista==='dal') c.innerHTML=htmlDal();
  else if(vista==='relatorio') c.innerHTML=htmlRelatorio();
  else if(vista==='usuarios'){ c.innerHTML='<div class="vazio">Carregando…</div>'; renderUsuarios(); }
  else if(vista==='acessos'){ c.innerHTML='<div class="vazio">Carregando…</div>'; renderAcessos(); }
}
function preencherSugestoes(){
  const pega=function(campo){ const m={}; ativos().forEach(function(o){ if(o[campo]) m[o[campo]]=1; }); return Object.keys(m).sort(); };
  const op=function(l){ return l.map(function(x){return '<option value="'+esc(x)+'">';}).join(''); };
  $('dl-produtos').innerHTML=op(pega('produto')); $('dl-marcas').innerHTML=op(pega('marca'));
  $('dl-vendedores').innerHTML=op(pega('vendedor')); $('dl-profissionais').innerHTML=op(pega('profissional'));
}
function anosComDados(){
  const m={}; m[new Date().getFullYear()]=1;
  ativos().forEach(function(o){ if(o.dataOrcamento) m[o.dataOrcamento.slice(0,4)]=1; });
  return Object.keys(m).sort().reverse();
}

// ---------- filtros ----------
function barraFiltros(comNovo){
  const sel=function(id,rot,lista,val){ return '<select onchange="filtro.'+id+'=this.value;render()"><option value="">'+rot+'</option>'+
    lista.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>'; };
  const pega=function(campo){ const m={}; ativos().forEach(function(o){ if(o[campo]) m[o[campo]]=1; }); return Object.keys(m).sort(); };
  return '<div class="barra">'+
    '<input placeholder="Buscar cliente, produto, profissional…" value="'+esc(filtro.busca)+'" oninput="filtro.busca=this.value;clearTimeout(window._tb);window._tb=setTimeout(render,250)" style="min-width:220px">'+
    sel('ano','Todos os anos',anosComDados(),filtro.ano)+sel('marca','Todas as marcas',pega('marca'),filtro.marca)+
    sel('vendedor','Todos os vendedores',pega('vendedor'),filtro.vendedor)+
    '<label style="font-size:13px;display:flex;gap:5px;align-items:center"><input type="checkbox"'+(filtro.semData?' checked':'')+' onchange="filtro.semData=this.checked;render()"> Só sem data</label>'+
    '<span class="esp"></span>'+
    (comNovo&&podeAlterar()?'<button class="btn btn-p" onclick="abrirFicha()">+ Novo orçamento</button>':'')+
  '</div>';
}
function filtrados(){
  const b=filtro.busca.toLowerCase();
  return ativos().filter(function(o){
    if(filtro.ano && String(o.dataOrcamento||'').slice(0,4)!==filtro.ano) return false;
    if(filtro.marca && o.marca!==filtro.marca) return false;
    if(filtro.vendedor && o.vendedor!==filtro.vendedor) return false;
    if(filtro.semData && o.dataOrcamento) return false;

function etiquetas(o){

let dalAberto=null;
function meuDoDal(id){ return ativos().find(function(o){ return o.dalId===id; })||null; }
function tamanhoBR(b){ b=Number(b)||0; return b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':b>=1024?Math.round(b/1024)+' KB':(b?b+' B':''); }
function abrirDal(id){
  const o=((dal&&dal.orcamentos)||[]).find(function(x){ return x.id===id; });

  dalAberto=o;

  const docs=(o.docs||[]);
  $('fd-titulo').textContent=o.cliente||'Orçamento da Daluminium';
  $('fd-corpo').innerHTML=
    '<div class="grade">'+
      linha('Cliente',esc(o.cliente))+linha('Telefone',tel)+
      linha('E-mail',o.email?'<a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a>':'')+linha('Cidade / bairro',esc([o.cidade,o.bairro].filter(Boolean).join(' · ')))+
      linha('Vendedora (Daluminium)',esc(o.vendedora))+linha('Etapa lá',esc(o.etapa)+(o.motivoPerda?' — '+esc(o.motivoPerda):''))+
      linha('Valor lá',o.valor?moeda(o.valor):'')+linha('Lançado / atualizado',dataBR(o.criadoEm)+(o.atualizadoEm?' · '+dataBR(o.atualizadoEm):''))+
    '</div>'+
    '<h2 style="margin-top:14px">O que o cliente quer</h2>'+
    '<div style="background:var(--areia-cl);border-radius:6px;padding:10px 12px;white-space:pre-wrap">'+(esc(o.interesse)||'<span class="dica">Nada escrito em "Interesse".</span>')+'</div>'+
    (o.obs?'<h2>Observações</h2><div style="background:var(--areia-cl);border-radius:6px;padding:10px 12px;white-space:pre-wrap">'+esc(o.obs)+'</div>':'')+
    '<h2>Anexos ('+docs.length+')</h2>'+
    (docs.length?'<div class="tabela-caixa"><table><tbody>'+docs.map(function(d,i){
      return '<tr><td>📎 '+esc(d.nome)+' <span class="dica">'+tamanhoBR(d.tamanho)+(d.quando?' · '+dataBR(d.quando):'')+'</span></td><td style="text-align:right">'+
        (d.arquivo?'<button class="btn" onclick="abrirAnexoDal('+i+',\'ver\')">Ver</button> <button class="btn" onclick="abrirAnexoDal('+i+',\'baixar\')">Baixar</button>'
          :(d.link?'<a class="btn" href="'+esc(d.link)+'" target="_blank" rel="noopener">Abrir link</a>':''))+'</td></tr>';
    }).join('')+'</tbody></table></div><p class="dica" style="margin-top:6px">Cada abertura fica anotada nos dois sistemas. O link vale 1 minuto.</p>':'<div class="dica">Nenhum anexo.</div>')+

}
function fecharDal(){ $('ficha-dal').classList.remove('on'); dalAberto=null; }
async function abrirAnexoDal(i,modo){
  const o=dalAberto; const d=o&&(o.docs||[])[i]; if(!d) return;
  // A aba abre JÁ no clique (senão o navegador bloqueia) e recebe o endereço depois.
  const aba=window.open('about:blank','_blank');
  const r=await api('daluminium-anexo','POST',{negocio:o.id,doc:d.id,modo:modo,nomeArquivo:d.nome});
  if(r.status!==200||!r.j.abrir){ if(aba) aba.close(); alert(r.j.erro||'Não consegui abrir o anexo.'); return; }
  if(aba) aba.location.href=r.j.abrir; else location.href=r.j.abrir;
}
async function acompanharDal(){
  const o=dalAberto; if(!o) return;
  const meu=meuDoDal(o.id);
  if(meu){ fecharDal(); abrirFicha(meu.id); return; }
  // Cria um orçamento da Solutio ligado a este (dalId). Os dados que vieram
  // da Daluminium entram como ponto de partida; o resto a Solutio completa.
  const id=novoId();
  const ok=await alterar(function(base){
    if(base.orcamentos.some(function(x){ return x.dalId===o.id && !x.excluido; })) return false;
    base.orcamentos.push({id:id,dalId:o.id,dataOrcamento:String(o.criadoEm||'').slice(0,10),etapa:'proposta',
      cliente:o.cliente||'',telefone:o.telefone||'',cidade:o.cidade||'',uf:'RO',vendedor:o.vendedora||'',valor:Number(o.valor)||0,
      situacao:'Veio da Daluminium',criadoEm:agora(),criadoPor:eu.n,atualizadoEm:agora(),atualizadoPor:eu.n,
      notas:[{quando:agora(),quem:eu.n,texto:'Veio da Daluminium (vendedora '+(o.vendedora||'—')+'). O que o cliente quer: '+(o.interesse||'—')}]});
  });
  if(!ok){ alert('Não consegui criar. Atualize a tela e tente de novo.'); return; }
  fecharDal(); render(); abrirFicha(id);
}

function abrirFicha(id){
  const o=id?ativos().find(function(x){return x.id===id;}):null;
  if(id&&!o){ alert('Este orçamento não está mais aqui. Atualize a tela.'); return; }
  fichaId=id||null;
  $('f-etapa').innerHTML=ETAPAS.map(function(e){return '<option value="'+e.id+'">'+esc(e.nome)+'</option>';}).join('');
  const p=function(c,v){ $(c).value=v==null?'':v; };
  const x=o||{etapa:'proposta',dataOrcamento:new Date(Date.now()-4*3600e3).toISOString().slice(0,10),uf:'RO',cidade:'Porto Velho'};
  p('f-data',x.dataOrcamento); p('f-etapa',x.etapa||'proposta'); p('f-cliente',x.cliente); p('f-telefone',x.telefone);
  p('f-produto',x.produto); p('f-marca',x.marca); p('f-valor',valorCampo(x.valor)); p('f-vendedor',x.vendedor);
  p('f-profissional',x.profissional); p('f-prazo',x.prazo); p('f-cidade',x.cidade); p('f-uf',x.uf);
  p('f-situacao',x.situacao); p('f-motivo',x.motivoPerda); p('f-nota','');
  mostrarMotivo();
  $('f-notas').innerHTML=(x.notas||[]).slice().reverse().map(function(n){ return '<div class="nota"><b>'+dataBR(n.quando)+' · '+esc(n.quem)+'</b>'+esc(n.texto)+'</div>'; }).join('');
  $('f-quem').textContent=o?('Lançado por '+(o.criadoPor||'—')+(o.criadoEm?' em '+dataBR(o.criadoEm):'')+(o.atualizadoPor?' · última alteração: '+o.atualizadoPor+' em '+dataBR(o.atualizadoEm):'')):'';
  $('ficha-titulo').textContent=o?(o.cliente||'Orçamento'):'Novo orçamento';
  const pode=podeAlterar();
  document.querySelectorAll('#ficha input,#ficha select,#ficha textarea').forEach(function(el){ el.disabled=!pode; });
  $('f-salvar').classList.toggle('oculto',!pode);
  $('f-excluir').classList.toggle('oculto',!(o&&nivel()>=NIVEL.gerente));
  $('ficha').classList.add('on');
  setTimeout(function(){ $('f-cliente').focus(); },50);
}
function mostrarMotivo(){ $('fg-motivo').classList.toggle('oculto',etapa($('f-etapa').value).tipo!=='perdido'); }
function fecharFicha(){ $('ficha').classList.remove('on'); fichaId=null; }
async function salvarFicha(){
  const v=function(id){ return $(id).value.trim(); };
  const f={dataOrcamento:v('f-data'),etapa:v('f-etapa'),cliente:v('f-cliente'),telefone:v('f-telefone'),produto:v('f-produto'),
    marca:v('f-marca'),valor:lerValor(v('f-valor')),vendedor:v('f-vendedor'),profissional:v('f-profissional'),prazo:v('f-prazo'),
    cidade:v('f-cidade'),uf:v('f-uf').toUpperCase(),situacao:v('f-situacao'),motivoPerda:etapa(v('f-etapa')).tipo==='perdido'?v('f-motivo'):''};
  if(!f.cliente){ alert('Preencha o nome do cliente.'); $('f-cliente').focus(); return; }
  if(f.dataOrcamento && f.dataOrcamento>new Date().toISOString().slice(0,10)){ alert('A data do orçamento está no futuro. Confira.'); return; }
  const nota=v('f-nota');
  const id=fichaId||novoId();
  $('f-salvar').disabled=true;
  const ok=await alterar(function(base){
    let o=base.orcamentos.find(function(x){return x.id===id;});
    if(!o){ o={id:id,criadoEm:agora(),criadoPor:eu.n,notas:[]}; base.orcamentos.push(o); }
    const antes=o.etapa;
    Object.assign(o,f);
    if(!Array.isArray(o.notas)) o.notas=[];
    if(antes && antes!==f.etapa) o.notas.push({quando:agora(),quem:eu.n,texto:'Etapa: '+etapa(antes).nome+' → '+etapa(f.etapa).nome});
    if(nota) o.notas.push({quando:agora(),quem:eu.n,texto:nota});
    if(etapa(f.etapa).tipo!=='aberto' && etapa(antes).tipo==='aberto') o.fechadoEm=agora();
    o.atualizadoEm=agora(); o.atualizadoPor=eu.n;
  });
  $('f-salvar').disabled=false;
  if(ok){ fecharFicha(); render(); }
}
async function excluirOrcamento(){
  const id=fichaId; const o=ativos().find(function(x){return x.id===id;});
  if(!o||!confirm('Excluir o orçamento de '+(o.cliente||'—')+'?\n\nEle sai das telas e dos relatórios. (Fica guardado no histórico do banco.)')) return;
  const ok=await alterar(function(base){ const x=base.orcamentos.find(function(y){return y.id===id;}); if(!x) return false; x.excluido=true; x.excluidoEm=agora(); x.excluidoPor=eu.n; });
  if(ok){ fecharFicha(); render(); }
}

// ---------- senha ----------
function abrirSenha(obrigatoria){
  $('s-atual').value=''; $('s-nova').value=''; $('s-nova2').value=''; $('s-msg').textContent='';
  $('senha-titulo').textContent=obrigatoria===true?'Crie a sua senha (primeiro acesso)':'Trocar senha';
  $('senha-fechar').classList.toggle('oculto',obrigatoria===true);
  $('janela-senha').classList.add('on');
}
function fecharSenha(){ $('janela-senha').classList.remove('on'); esconderSenhas(); }
async function trocarSenha(){
  const a=$('s-atual').value, n=$('s-nova').value, n2=$('s-nova2').value;
  if(n.length<8){ $('s-msg').textContent='A senha nova precisa de 8 caracteres ou mais.'; return; }
  if(n!==n2){ $('s-msg').textContent='As duas senhas novas não são iguais.'; return; }
  const r=await api('trocar-senha','POST',{atual:a,nova:n});
  if(r.status!==200){ $('s-msg').textContent=r.j.erro||'Não consegui trocar.'; return; }
  eu.trocar=false; try{ sessionStorage.setItem('solutio-eu-'+SISTEMA,JSON.stringify(eu)); }catch(e){}
  fecharSenha(); alert('Senha trocada.');
}

// ---------- usuários (admin) ----------
async function renderUsuarios(){
  const r=await api('usuarios','GET',null);
  if(vista!=='usuarios') return;
  if(r.status!==200){ $('conteudo').innerHTML='<div class="aviso erro">'+esc(r.j.erro||'Não consegui carregar.')+'</div>'; return; }
  const rot=ROTULO;
  window._usuarios=r.j.lista;
  $('conteudo').innerHTML='<div class="barra"><span class="esp"></span><button class="btn btn-p" onclick="editarUsuario()">+ Novo usuário</button></div>'+
    '<div class="tabela-caixa"><table><thead><tr><th>Nome</th><th>Login</th><th>Função</th><th>Situação</th><th></th></tr></thead><tbody>'+
    r.j.lista.map(function(u,i){ return '<tr><td>'+esc(u.n)+'</td><td>'+esc(u.u)+'</td><td>'+esc(rot[u.r]||u.r)+'</td><td>'+(u.ativo?(u.trocar?'Senha provisória':'Ativo'):'Desligado')+'</td><td><button class="btn" onclick="editarUsuario('+i+')">Alterar</button></td></tr>'; }).join('')+
    '</tbody></table></div><p class="dica" style="margin-top:10px">'+(NO_TESTE?'<b>Lista de usuários do TESTE</b> — separada da produção, com senhas próprias. ':'')+'<b>Administrador</b>: tudo. <b>Gerente</b>: lança, corrige e exclui; cadastra funcionário e consulta. <b>Funcionário</b>: lança e atualiza, não exclui. <b>Só consulta</b>: olha, não altera.</p>';
}
async function editarUsuario(i){
  const u=(typeof i==='number')?window._usuarios[i]:null;
  const login=u?u.u:prompt('Login (ex.: paula):'); if(!login) return;
  const nome=prompt('Nome:',u?u.n:''); if(nome===null) return;
  const opcoes=eu.r==='admin'?'admin, gerente, funcionario ou consulta':'funcionario ou consulta';
  const funcao=prompt('Função — digite '+opcoes+':',u?u.r:'funcionario'); if(funcao===null) return;
  const ativo=u?confirm('Manter o acesso ATIVO?\n\nOK = ativo · Cancelar = desligar'):true;
  const senha=prompt(u?'Senha provisória nova (deixe em branco para não trocar):':'Senha provisória (8+ caracteres; a pessoa troca no primeiro acesso):','');
  if(senha===null) return;
  const r=await api('usuarios','POST',{u:login.trim().toLowerCase(),n:nome.trim(),r:funcao.trim().toLowerCase(),ativo:ativo,senha:senha});
  if(r.status!==200){ alert(r.j.erro||'Não gravou.'); return; }
  renderUsuarios();
}

// ---------- olhinho da senha ----------
const OLHO_ABERTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OLHO_FECHADO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
document.querySelectorAll('input[type="password"]').forEach(function(inp){
  const caixa=document.createElement('span'); caixa.className='senha-caixa';
  inp.parentNode.insertBefore(caixa,inp); caixa.appendChild(inp);
  const b=document.createElement('button'); b.type='button'; b.className='olhinho'; b.tabIndex=-1;
  b.setAttribute('aria-label','Mostrar senha'); b.innerHTML=OLHO_ABERTO;
  b.onclick=function(){ const ver=inp.type==='password'; inp.type=ver?'text':'password';
    b.innerHTML=ver?OLHO_FECHADO:OLHO_ABERTO; b.setAttribute('aria-label',ver?'Esconder senha':'Mostrar senha'); inp.focus(); };
  caixa.appendChild(b);
});
// Ao fechar a janela de senha ou sair, a senha volta a ficar escondida.
function esconderSenhas(){ document.querySelectorAll('.senha-caixa input').forEach(function(i){ i.type='password'; }); document.querySelectorAll('.olhinho').forEach(function(b){ b.innerHTML=OLHO_ABERTO; }); }

// ---------- acessos (caderno, só admin) ----------
async function renderAcessos(){
  const r=await api('acessos','GET',null);
  if(vista!=='acessos') return;
  if(r.status!==200){ $('conteudo').innerHTML='<div class="aviso erro">'+esc(r.j.erro||'Não consegui carregar.')+'</div>'; return; }
  const l=r.j.lista||[];
  const hora=function(t){ const d=new Date(t); return isNaN(d)?'':d.toLocaleString('pt-BR',{timeZone:'America/Porto_Velho',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
  const erradas=l.filter(function(x){ return x.acao==='senha errada'||x.acao==='barrado'; }).length;
  $('conteudo').innerHTML=(r.j.erro?'<div class="aviso erro">'+esc(r.j.erro)+'</div>':'')+
    '<div class="aviso" style="background:var(--vinho-cl);color:var(--vinho)">Caderno de acessos'+(NO_TESTE?' do <b>TESTE</b>':'')+': quem entrou, errou a senha, lançou, alterou ou excluiu orçamento e mexeu em usuário. Guardado por 5 anos; ninguém altera nem apaga. Mostrando os últimos '+l.length+'.'+(erradas?' <b>'+erradas+' senha(s) errada(s) ou bloqueio(s)</b> nesta lista.':'')+'</div>'+
    '<div class="barra"><span class="esp"></span><button class="btn" onclick="render()">Atualizar</button></div>'+
    '<div class="tabela-caixa"><table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>Detalhe</th><th>Endereço</th></tr></thead><tbody>'+
    (l.length?l.map(function(x){ const alerta=x.acao==='senha errada'||x.acao==='barrado';
      return '<tr'+(alerta?' style="color:var(--vermelho)"':'')+'><td>'+hora(x.criado_em)+'</td><td>'+esc(x.nome||x.usuario)+'</td><td>'+esc(x.acao)+'</td><td>'+esc(x.alvo)+'</td><td>'+esc(x.endereco)+'</td></tr>'; }).join(''):'<tr><td colspan="5" class="vazio">Nada anotado ainda.</td></tr>')+
    '</tbody></table></div><p class="dica" style="margin-top:10px">"Endereço" é um resumo do endereço de internet (não o número): o mesmo resumo = o mesmo lugar.</p>';
}

// ---------- início ----------
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && !$('tela-login').classList.contains('oculto')) entrar();
  if(e.key==='Escape' && $('ficha').classList.contains('on')) fecharFicha();
});
(function(){
  try{
    const c=sessionStorage.getItem('solutio-cracha-'+SISTEMA), u=sessionStorage.getItem('solutio-eu-'+SISTEMA);
    if(c&&u){ cracha=c; eu=JSON.parse(u); abrirSistema().then(function(){ if(eu&&eu.trocar) abrirSenha(true); }); }
  }catch(e){}
})();
